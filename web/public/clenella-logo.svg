<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Clenella favicon</title>
  <desc id="desc">A teal rounded-square app icon with a white house-shaped C and four-pane window.</desc>

  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="910" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18bcc3"/>
      <stop offset="1" stop-color="#099eab"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>

  <!-- Main C / roof stroke -->
  <path
    d="M 724 744
       C 610 802, 465 795, 410 770
       C 310 724, 260 620, 268 510
       C 276 404, 335 340, 435 263
       L 505 205
       L 710 398"
    fill="none"
    stroke="#ffffff"
    stroke-width="104"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Chimney -->
  <path
    d="M 666 210
       H 702
       C 711 210, 718 217, 718 226
       V 364
       H 650
       V 226
       C 650 217, 657 210, 666 210
       Z"
    fill="#ffffff"/>

  <!-- Window -->
  <rect x="438" y="458" width="67" height="65" rx="12" fill="#ffffff"/>
  <rect x="526" y="458" width="67" height="65" rx="12" fill="#ffffff"/>
  <rect x="438" y="542" width="67" height="65" rx="12" fill="#ffffff"/>
  <rect x="526" y="542" width="67" height="65" rx="12" fill="#ffffff"/>

</svg>
