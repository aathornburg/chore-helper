services:
  postgres:
    image: postgres:17-alpine
    container_name: chore-helper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chore_helper
      POSTGRES_USER: chore_helper
      POSTGRES_PASSWORD: chore_helper_password
    ports:
      - "5432:5432"
    volumes:
      - chore-helper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chore_helper -d chore_helper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chore-helper-postgres-data:
